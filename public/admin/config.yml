backend:
  name: github
  repo: Yocchi3191/study-cloudflare-and-cms
  branch: main

publish_mode:
  type: editorial_workflow
  stages: [draft, pending_review]
  direct_publish: false

media_folder: public/images
public_folder: /images

collections:
  - name: pages
    label: ページ
    folder: src/content/pages
    extension: md
    create: true
    publish: false
    slug: "{{slug}}"
    fields:
      - { name: title, label: タイトル, widget: string }
      - { name: body, label: 本文, widget: markdown }
